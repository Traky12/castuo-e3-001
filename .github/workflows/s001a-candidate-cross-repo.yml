name: S-001A real-runner candidate contract (NO G2)

on:
  pull_request:
    paths:
      - ".github/workflows/s001a-candidate-cross-repo.yml"
      - "scripts/run_s001a_foreign_replay.py"
      - "tests/fixtures/s001a_candidate_real_runner.json"
      - "tests/test_s001a_candidate_harness.py"
      - "scripts/check_joint_candidate.py"

permissions:
  contents: read

jobs:
  real-runner-candidate:
    name: Evidence source pinned / S-001A candidate only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout E3 candidate without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: e3
      - name: Checkout public Evidence candidate at exact immutable commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Traky12/castuo-evidence
          ref: 8b23f4370bccdf8c7dcbd93d395b41b70d6ba1de
          path: evidence-public
          persist-credentials: false
      - name: Checkout public Edge candidate at exact immutable commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Traky12/castuo-agro-edge
          ref: a0639d6a234807c4f323d6e4a7b786cda9fd51e2
          path: edge-public
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Verify full E3 Git tree against SHA-256 manifest (integrity only)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path("e3").resolve()
          def unique(pairs):
              out = {}
              for key, value in pairs:
                  if key in out:
                      raise ValueError("duplicate manifest property")
                  out[key] = value
              return out

          report = json.loads((root / "SHA256SUMS.json").read_text(encoding="utf-8"),
                              object_pairs_hook=unique)
          records = report["files"]
          assert report["algorithm"] == "SHA-256"
          assert report["self_excluded"] is True
          assert report["file_count"] == len(records)
          tracked = set()
          raw = subprocess.check_output(["git", "-C", str(root), "ls-files", "--stage", "-z"])
          for item in raw.split(b"\0"):
              if not item:
                  continue
              metadata, rawpath = item.split(b"\t", 1)
              mode, _, stage = metadata.decode("ascii").split(" ")
              assert stage == "0" and mode in ("100644", "100755")
              tracked.add(rawpath.decode("utf-8"))
          inventory = set()
          agg = hashlib.sha256()
          for entry in sorted(records, key=lambda item: item["path"]):
              name, expected = entry["path"], entry["sha256"]
              assert isinstance(name, str) and isinstance(expected, str)
              assert name != "SHA256SUMS.json" and name and not name.startswith("/")
              assert "\\" not in name and all(seg not in ("", ".", "..") for seg in name.split("/"))
              assert name not in inventory and len(expected) == 64
              assert all(ch in "0123456789abcdef" for ch in expected)
              inventory.add(name)
              target = root / name
              assert target.is_file() and not target.is_symlink()
              assert target.resolve().is_relative_to(root)
              filehash = hashlib.sha256(target.read_bytes()).hexdigest()
              assert filehash == expected, name
              agg.update((name + "\0" + expected + "\n").encode("utf-8"))
          assert tracked == inventory | {"SHA256SUMS.json"}
          assert agg.hexdigest() == report["global_sha256"]
          print("E3_COMPLETE_MANIFEST_SHA256_PASS:", len(inventory), agg.hexdigest(),
                "LIMIT: LOCAL_INTEGRITY_ONLY; G1/G2: BLOCKED")
          PY
      - name: Install E3 verifier dependencies and JSON Schema checker
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r e3/requirements.txt "jsonschema==4.25.1"
          python -c "from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey; print('ED25519_IMPORT_OK')"
      - name: Reject false-positive unsigned policy reports in unit tests
        shell: bash
        run: python -m unittest discover -s e3/tests -p "test_unsigned_rejection_policy.py" -v

      - name: Check immutable Evidence and Edge source pin agreement (fail closed)
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import json
          import re
          from pathlib import Path

          root = Path("e3")
          workflow = (root / ".github/workflows/s001a-candidate-cross-repo.yml").read_text(encoding="utf-8")
          source = (root / "scripts/check_joint_candidate.py").read_text(encoding="utf-8")
          values = {}
          for statement in ast.parse(source).body:
              if isinstance(statement, ast.Assign) and len(statement.targets) == 1:
                  target = statement.targets[0]
                  if isinstance(target, ast.Name) and isinstance(statement.value, ast.Constant):
                      values[target.id] = statement.value.value

          def check(workflow_text):
              problems = []
              for repository, key in (("castuo-evidence", "EVIDENCE_SHA"), ("castuo-agro-edge", "EDGE_SHA")):
                  expected = values.get(key)
                  refs = re.findall(
                      rf"repository: Traky12/{repository}\s*\n\s*ref:\s*([^\s]+)",
                      workflow_text
                  )
                  if not isinstance(expected, str) or not re.fullmatch(r"[0-9a-f]{40}", expected):
                      problems.append(key + ": invalid commit")
                  if refs != [expected]:
                      problems.append(repository + ": checkout pin drift")
              for key in ("EVIDENCE_RUNNER_SHA256", "EDGE_EXPORT_SHA256"):
                  if not isinstance(values.get(key), str) or not re.fullmatch(r"[0-9a-f]{64}", values[key]):
                      problems.append(key + ": invalid SHA-256")
              runner = re.findall(r"--runner-script-sha256\s+([0-9a-f]{64})", workflow_text)
              if runner != [values.get("EVIDENCE_RUNNER_SHA256")]:
                  problems.append("runner hash drift")
              if len(re.findall(r"(?m)^\s+persist-credentials: false\s*$", workflow_text)) < 3:
                  problems.append("checkout credentials not disabled")
              if "permissions:\n  contents: read" not in workflow_text:
                  problems.append("contents not read-only")
              uses = re.findall(r"uses:\s+actions/(?:checkout|setup-python)@([^\s]+)", workflow_text)
              if len(uses) < 4 or any(not re.fullmatch(r"[0-9a-f]{40}", v) for v in uses):
                  problems.append("mutable Actions reference")
              tail = workflow_text.split("      - name: External evidence validator must semantically reject unsigned candidate", 1)
              if len(tail) != 2 or 'echo "UNSIGNED_CANDIDATE_REJECTED_BY_E3_POLICY: YES"' not in tail[1]:
                  problems.append("semantic reject guard absent")
              return problems

          assert check(workflow) == [], check(workflow)
          for source_pin in (values["EDGE_SHA"], values["EVIDENCE_SHA"]):
              corrupted = workflow.replace("ref: " + source_pin, "ref: main", 1)
              assert check(corrupted), "mutable checkout incorrectly accepted"
          tampered = workflow.replace("persist-credentials: false", "persist-credentials: true", 1)
          assert check(tampered), "privilege regression incorrectly accepted"
          without_semantic = workflow.replace('echo "UNSIGNED_CANDIDATE_REJECTED_BY_E3_POLICY: YES"', 'echo "NO_SEMANTIC_REJECTION"')
          assert check(without_semantic), "missing policy rejection incorrectly accepted"
          print(json.dumps({"status": "PIN_CONSISTENCY_ONLY", "promotion": "BLOCKED", "negative_controls": 4}))
          PY
      - name: Edge → Evidence → E3 synthetic candidate using identical exported fixture
        shell: bash
        run: |
          set -euo pipefail
          python -B e3/scripts/check_joint_candidate.py \
            --edge edge-public \
            --evidence evidence-public \
            --e3 e3
      - name: Verify actual Evidence source bytes before test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C evidence-public rev-parse HEAD)" = "8b23f4370bccdf8c7dcbd93d395b41b70d6ba1de"
          printf '%s  %s\n' "41077a6848ec1429e34cf20babcf5fb2b37ab2fbc4f675b20c840ab8f49ca360" "evidence-public/runners/s001a_runner.py" | sha256sum -c -
          test -z "$(git -C evidence-public status --porcelain --untracked-files=no)"
      - name: Execute three real-runner replays (candidate, not independent)
        shell: bash
        run: |
          set -euo pipefail
          python -B e3/scripts/run_s001a_foreign_replay.py \
            --fixture e3/tests/fixtures/s001a_candidate_real_runner.json \
            --runner-script evidence-public/runners/s001a_runner.py \
            --runner-script-sha256 41077a6848ec1429e34cf20babcf5fb2b37ab2fbc4f675b20c840ab8f49ca360 \
            --source-commit 8b23f4370bccdf8c7dcbd93d395b41b70d6ba1de \
            --runner-id CI-CANDIDATE-UNVERIFIED \
            --output "$RUNNER_TEMP/s001a-candidate-report" \
            --stress-repetitions 3
      - name: Assert claim firewall and integrity of candidate result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"s001a-candidate-report/candidate-replay.json"
          result=json.loads(p.read_text(encoding="utf-8"))
          assert result["status"]=="CANDIDATE_REPLAY_ONLY"
          assert result["equivalent"] is True
          assert result["promotion"]=="BLOCKED"
          assert result["independence"]=="NOT_AUTHENTICATED"
          assert result["network_isolation"]=="NOT_VERIFIED_BY_THIS_HARNESS"
          assert result["signed_attestation"] is False
          assert result["reviewer_signatures"]==0
          assert all(result[key] is False for key in ("oneR","oneV","oneA"))
          assert len(result["replays"])==3
          assert len({r["functional_hash"] for r in result["replays"]})==1
          assert len({r["events_hash"] for r in result["replays"]})==1
          print("CANDIDATE_3_REPLAYS_MATCHED: YES; G2_ELIGIBLE: NO")
          PY
      - name: External evidence validator must semantically reject unsigned candidate
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/s001a-unsigned-validation.json"
          rm -f "$report"
          set +e
          python -B e3/scripts/validate_external_evidence_bundle.py "$RUNNER_TEMP/s001a-candidate-report" --min-reviewers 2 --output "$report" > "$RUNNER_TEMP/s001a-unsigned-stdout.json"
          code=$?
          set -e
          python -B e3/scripts/check_unsigned_rejection.py "$report" "$code"
          echo "UNSIGNED_CANDIDATE_REJECTED_BY_E3_POLICY: YES"
