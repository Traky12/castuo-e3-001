name: Secret Scan (gitleaks, PR diff)

# Castuo-system is private: GitHub secret scanning is not available here.
# This job blocks PRs that ADD literal secrets (SEC-INC-001 class: passwords
# and API keys in assignments / .env templates). It scans only the commits of
# the PR, so pre-existing history does not block unrelated work; the full-tree
# baseline is triaged separately under SEC-INC-001. Output is always redacted.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan commits added by this PR (redacted)
        env:
          GITLEAKS_REPORT: \${{ runner.temp }}/gitleaks-report.json
        run: |
          set -euo pipefail
          if [ "\${{ github.event_name }}" = "pull_request" ]; then
            range="\${{ github.event.pull_request.base.sha }}..\${{ github.event.pull_request.head.sha }}"
          else
            range="HEAD~1..HEAD"
          fi
          echo "Scanning range: \${range}"
          code=0
          gitleaks git --config .gitleaks.toml --redact --no-banner \
            --report-format json --report-path "$GITLEAKS_REPORT" \
            --log-opts="\${range}" --exit-code 1 || code=$?
          # Print safe finding metadata only; never print Match, Secret or the raw report.
          python - "$GITLEAKS_REPORT" <<'PY'
          import json
          import sys
          from pathlib import Path

          report_path = Path(sys.argv[1])
          if not report_path.exists():
              print("Gitleaks report missing; failing closed.")
              raise SystemExit(2)
          try:
              report = json.loads(report_path.read_text(encoding="utf-8"))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError):
              print("Gitleaks report unreadable; failing closed.")
              raise SystemExit(2)
          if not isinstance(report, list):
              print("Gitleaks report shape invalid; failing closed.")
              raise SystemExit(2)
          for item in report:
              if not isinstance(item, dict):
                  continue
              print(
                  "Finding:",
                  "rule=" + str(item.get("RuleID", "unknown")),
                  "file=" + str(item.get("File", "unknown")),
                  "line=" + str(item.get("StartLine", "unknown")),
                  "commit=" + str(item.get("Commit", "unknown")),
                  "fingerprint=" + str(item.get("Fingerprint", "unknown")),
              )
          print("Gitleaks finding count:", len(report))
          PY
          exit "$code"
